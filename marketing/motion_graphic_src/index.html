<!doctype html><html><head><meta charset="utf8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>html,body{margin:0;background:#0e0f14}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="data.js"></script>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),W=1080,H=1920,D=window.DATA,F=D.f;
const GOLD='#ffc23d',PINK='#ff4f8b',VIO='#9b6bff',INK='#f4f1ea',MUT='#8a88a0',BG='#0e0f14',GOOD='#3ddc84';
const HEAD='"Unbounded",sans-serif',MONO='"JetBrains Mono",monospace';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,back=x=>{const k=1.70158;return 1+(k+1)*Math.pow(x-1,3)+k*Math.pow(x-1,2)};
const fmt=n=>Math.round(n).toLocaleString('en-US');
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const P=Array.from({length:150},()=>({x:rnd()*W,y:rnd()*H,r:2+rnd()*5,s:40+rnd()*160,c:[PINK,VIO,GOLD][Math.floor(rnd()*3)],p:rnd()*6.3}));
function txt(s,x,y,size,col,font=HEAD,w=900,al='center',a=1,ls=0){g.save();g.globalAlpha=a;g.font=`${w} ${size}px ${font}`;g.fillStyle=col;g.textAlign=al;g.textBaseline='middle';if(ls){g.letterSpacing=ls+'px'}g.fillText(s,x,y);g.restore()}
function glow(col,b){g.shadowColor=col;g.shadowBlur=b}
function bg(t,pull){ // particles; pull>0 sucks them toward the centre dial
  g.fillStyle=BG;g.fillRect(0,0,W,H);
  const gr=g.createRadialGradient(W/2,H*.42,50,W/2,H*.42,1100);gr.addColorStop(0,'rgba(155,107,255,.13)');gr.addColorStop(1,'rgba(14,15,20,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);
  P.forEach(q=>{let x=(q.x+q.s*t)%(W+40)-20,y=q.y+Math.sin(t*1.3+q.p)*30;
    if(pull>0){x=x+(W/2-x)*pull;y=y+(H*.42-y)*pull}
    g.globalAlpha=(.35+.35*Math.sin(t*2+q.p))*(1-pull*.7);g.fillStyle=q.c;g.beginPath();g.arc(x,y,q.r,0,6.3);g.fill()});g.globalAlpha=1}
function pop(t,a,dur=.35){return back(seg(t,a,a+dur))}
function scene1(t){ // 0-6: the two numbers
  const pull=eio(seg(t,2.2,3.0))*(1-seg(t,3.0,3.5));bg(t,pull*.85);
  const out=1-eo(seg(t,5.5,6));g.save();g.globalAlpha=out;
  // dial
  const R=330*pop(t,.15,.6),cx=W/2,cy=H*.42;
  if(R>0){g.save();glow(GOLD,60);g.lineWidth=10;g.strokeStyle=GOLD;g.beginPath();g.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+6.283*eio(seg(t,.2,1.6)));g.stroke();g.restore();
    g.lineWidth=3;g.strokeStyle=PINK;g.globalAlpha=.7*out;g.beginPath();g.arc(cx,cy,R+26,t*1.2,t*1.2+4.4);g.stroke();g.globalAlpha=out;
    for(let i=0;i<60;i++){const a=i/60*6.283+t*.3;g.strokeStyle=i%5?'rgba(255,255,255,.12)':'rgba(255,194,61,.7)';g.lineWidth=3;g.beginPath();g.moveTo(cx+Math.cos(a)*(R+44),cy+Math.sin(a)*(R+44));g.lineTo(cx+Math.cos(a)*(R+(i%5?56:66)),cy+Math.sin(a)*(R+(i%5?56:66)));g.stroke()}}
  txt('MY BOT CHECKED',cx,300,62,INK,HEAD,800,'center',eo(seg(t,.1,.5))*out);
  const n1=F.looks*eo(seg(t,.4,2.2));g.save();glow(GOLD,50);txt(fmt(n1),cx,cy-20,150,GOLD);g.restore();
  txt('PRICES IN 24 HOURS',cx,cy+90,30,MUT,MONO,700,'center',eo(seg(t,.6,1)),6);
  // second number slams in
  const k=seg(t,3.0,3.4);if(k>0){const sc=1+(1-back(k))*-.0+ (1-eo(k))*2.2;g.save();g.translate(cx,1400);g.scale(sc,sc);g.globalAlpha=eo(k)*out;
    txt('IT BET ON',0,-150,62,INK,HEAD,800);glow(PINK,70);txt(String(F.fills),0,30,300,PINK);g.restore();
    const sh=(1-seg(t,3.35,3.8));if(t>3.35&&sh>0){g.strokeStyle=`rgba(255,79,139,${sh*.8})`;g.lineWidth=8;g.beginPath();g.arc(cx,1430,200+(1-sh)*420,0,6.3);g.stroke()}}
  txt((100*F.fills/F.looks).toFixed(1)+'% TAKEN. THE REST: NOTHING.',cx,1700,38,INK,MONO,700,'center',eo(seg(t,4.1,4.5))*out,2);
  g.restore()}
function scene2(t0){const t=t0-6; // 6-11.5 gates
  bg(t0,0);const a=eo(seg(t,0,.4))*(1-eo(seg(t,5,5.5)));g.save();g.globalAlpha=a;
  txt('WHERE THE OTHER',W/2,250,58,INK,HEAD,800);txt(fmt(F.looks-F.fills)+' DIE',W/2,340,84,GOLD,HEAD,900);
  const rows=[['PRICE CHECKS',F.looks],['COIN IS LIVE, RIGHT MINUTE',F.eligible],['EDGE ≥ 5¢ AFTER FEES',F.edge5],['ORDER SENT',F.orders],['FILLED',F.fills]];
  rows.forEach(([lab,v],i)=>{const st=.5+i*.75,k=eo(seg(t,st,st+.55)),y=520+i*235,full=920,w=Math.max(full*Math.sqrt(v/F.looks),14)*k;
    g.globalAlpha=a*eo(seg(t,st-.1,st+.2));txt('GATE '+(i+1),80,y-58,26,MUT,MONO,700,'left',1,5);txt(lab,80+160,y-58,26,INK,MONO,700,'left');
    g.fillStyle='#1c1e27';g.beginPath();g.roundRect(80,y-22,full,70,16);g.fill();
    const gr=g.createLinearGradient(80,0,80+full,0);gr.addColorStop(0,VIO);gr.addColorStop(.55,PINK);gr.addColorStop(1,GOLD);g.save();glow(PINK,30*k);g.fillStyle=gr;g.beginPath();g.roundRect(80,y-22,w,70,16);g.fill();g.restore();
    txt(fmt(v*k),80+full,y+92,64,i==4?PINK:INK,HEAD,900,'right');
    if(i>0){const prev=rows[i-1][1],dk=seg(t,st+.25,st+.7);txt('−'+fmt((prev-v)*eo(dk)),80,y+92,34,'#ff8590',MONO,700,'left',eo(dk)*a)}});
  g.restore()}
function scene3(t0){const t=t0-11.5; // 11.5-16.5 real curve
  bg(t0,0);const a=eo(seg(t,0,.4))*(1-eo(seg(t,4.5,5)));g.save();g.globalAlpha=a;
  txt('REAL MONEY.',W/2,260,84,INK,HEAD,900);txt('REAL NUMBERS.',W/2,370,84,GOLD,HEAD,900);
  const cv=D.curve,x0=90,x1=990,y0=1250,y1=640,mx=Math.max(...cv),mn=Math.min(0,...cv),k=eio(seg(t,.5,3.2)),n=Math.max(2,Math.floor(cv.length*k));
  g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=2;for(let i=0;i<5;i++){const y=y0+(y1-y0)*i/4;g.beginPath();g.moveTo(x0,y);g.lineTo(x1,y);g.stroke()}
  const X=i=>x0+(x1-x0)*i/(cv.length-1),Y=v=>y0+(y1-y0)*(v-mn)/(mx-mn);
  g.beginPath();g.moveTo(X(0),Y(cv[0]));for(let i=1;i<n;i++)g.lineTo(X(i),Y(cv[i]));
  g.save();glow(GOLD,35);g.strokeStyle=GOLD;g.lineWidth=7;g.lineJoin='round';g.stroke();g.restore();
  g.lineTo(X(n-1),Y(mn));g.lineTo(X(0),Y(mn));g.closePath();const gr=g.createLinearGradient(0,y1,0,y0);gr.addColorStop(0,'rgba(255,194,61,.28)');gr.addColorStop(1,'rgba(255,194,61,0)');g.fillStyle=gr;g.fill();
  g.save();glow(GOLD,50);g.fillStyle='#fff';g.beginPath();g.arc(X(n-1),Y(cv[n-1]),13,0,6.3);g.fill();g.restore();
  const cur=cv[n-1];g.save();glow(GOOD,40);txt((cur<0?'−$':'+$')+Math.abs(cur).toFixed(2),W/2,1440,150,cur<0?'#ff5d6c':GOOD);g.restore();
  txt(fmt(D.bets*k)+' REAL BETS · WINS AND LOSSES',W/2,1570,32,INK,MONO,700,'center',1,2);
  txt('TWO WEEKS. COULD STILL BE LUCK.',W/2,1640,30,MUT,MONO,700,'center',eo(seg(t,3.2,3.6)),2);
  g.restore()}
function scene4(t0){const t=t0-16.5; // 16.5-20 end card
  bg(t0,0);const lines=[['BUILT WITH',INK,74],['CLAUDE.',GOLD,150],['FOLLOW TO SEE',INK,62],['IF IT WORKS.',PINK,92]];
  let y=560;lines.forEach(([s,col,sz],i)=>{const k=pop(t,.15+i*.28,.45);g.save();g.translate(W/2,y+ (1-k)*90);g.globalAlpha=cl(k);if(col!==INK)glow(col,55);txt(s,0,0,sz,col);g.restore();y+=sz*1.35+40});
  txt('REAL MONEY · EVERY LOSS POSTED',W/2,1420,32,INK,MONO,700,'center',eo(seg(t,1.6,2)),3);
  txt('not financial advice. you can lose money.',W/2,1700,28,MUT,MONO,500,'center',eo(seg(t,1.9,2.3)))}
window.draw=function(t){g.setTransform(1,0,0,1,0,0);if(t<6)scene1(t);else if(t<11.5)scene2(t);else if(t<16.5)scene3(t);else scene4(t)};
window.DUR=20;document.fonts.ready.then(()=>{window.READY=true;draw(0)});
</script></body></html>
