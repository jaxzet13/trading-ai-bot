<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#000}
.box{position:relative;width:3544px;height:2428px;display:grid;grid-template-columns:25.25% 49.32% 25.43%;background:#000;color:#f2f2f0;font-family:Manrope,sans-serif;overflow:hidden}
.p{position:relative;overflow:hidden}
.p+.p{border-left:2px solid rgba(255,255,255,.08)}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 45% at 50% 42%,var(--a2),transparent 70%)}
.c svg{position:absolute;left:50%;top:38%;width:420px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 30px rgba(255,255,255,.55)) drop-shadow(0 0 80px var(--a))}
.c .nm{position:absolute;left:0;right:0;top:62%;text-align:center;font-weight:600;font-size:120px;letter-spacing:.6em;text-indent:.6em}
.c .sub{position:absolute;left:0;right:0;top:71%;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:48px;letter-spacing:.4em;text-indent:.4em;color:var(--a)}
.c .ln{position:absolute;left:30%;right:30%;top:78.5%;height:3px;background:linear-gradient(90deg,transparent,var(--a),transparent)}
.c .ed{position:absolute;left:0;right:0;top:82%;text-align:center;font-size:40px;letter-spacing:.35em;text-indent:.35em;color:#9a9a96}
.c .frame{position:absolute;inset:150px;border:2px solid rgba(255,255,255,.18);border-radius:24px}
.s{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:60px;text-align:center;padding:0 120px}
.s .v{writing-mode:vertical-rl;font-weight:600;font-size:96px;letter-spacing:.6em;color:#e6e6e3}
.s .mk{width:150px;filter:drop-shadow(0 0 18px rgba(255,255,255,.5))}
.s .t{font-family:'IBM Plex Mono',monospace;font-size:34px;letter-spacing:.3em;color:#8a8a86;line-height:1.9}
.s .t b{color:var(--a);font-weight:500}
.stripe{position:absolute;left:0;right:0;height:14px}
.s .k{display:grid;gap:26px;font-size:38px;letter-spacing:.12em;color:#cfcfcb;text-align:left}
.s .k span{display:flex;align-items:center;gap:26px} .s .k i{width:34px;height:34px;border-radius:8px;display:inline-block}
</style></head><body>
<div class="box" id="box">
 <div class="p s" id="L"></div>
 <div class="p c"><div class="glow"></div><div class="frame"></div>
  <svg viewBox="0 0 40 40"><circle cx="20" cy="9.5" r="1.6" fill="#fff"/><path d="M11 15 L29 33 M29 15 L11 33" stroke="#fff" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
  <div class="nm">STIXX</div><div class="sub" id="sub"></div><div class="ln"></div><div class="ed" id="ed"></div></div>
 <div class="p s" id="R"></div>
</div>
<script>
const Q=new URLSearchParams(location.search), set=Q.get('set')||'all';
const S={all:{a:'#e6e6e3',a2:'rgba(255,255,255,.10)',sub:'LIMITED SERIES',ed:'BLOODMOON · FROSTBITE · VENOM',stripes:['#e0202d','#3fb6f0','#7ad61f']},
 BM:{a:'#ff3b47',a2:'rgba(224,32,45,.30)',sub:'BLOODMOON',ed:'LIMITED EDITION · 6 CARDS',stripes:['#e0202d']},
 FB:{a:'#5cc4f5',a2:'rgba(63,182,240,.28)',sub:'FROSTBITE',ed:'LIMITED EDITION · 6 CARDS',stripes:['#3fb6f0']},
 VN:{a:'#8be23a',a2:'rgba(122,214,31,.26)',sub:'VENOM',ed:'LIMITED EDITION · 6 CARDS',stripes:['#7ad61f']}}[set];
const box=document.getElementById('box'); box.style.setProperty('--a',S.a); box.style.setProperty('--a2',S.a2);
sub.textContent=S.sub; ed.textContent=S.ed;
const mk='<svg class="mk" viewBox="0 0 40 40"><circle cx="20" cy="9.5" r="1.6" fill="#fff"/><path d="M11 15 L29 33 M29 15 L11 33" stroke="#fff" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>';
L.innerHTML=mk+'<div class="v">STIXX</div><div class="t">TRADING<br>CARD GAME</div>';
R.innerHTML='<div class="k">'+[['#9b9b9b','COMMON'],['#3f9b6b','UNCOMMON'],['#3f7fe0','RARE'],['#9fd0ff','FOIL RARE'],['#d4a53a','SIGNATURE'],['#ff4d8d','MYTHIC']].map(([c,n])=>`<span><i style="background:${c}"></i>${n}</span>`).join('')+'</div><div class="t"><b>'+S.sub+'</b><br>COLLECT · RIP · FIGHT</div>';
S.stripes.forEach((c,i)=>{const d=document.createElement('div');d.className='stripe';d.style.background=c;d.style.bottom=(200+i*24)+'px';d.style.left='30%';d.style.right='30%';d.style.height='8px';d.style.borderRadius='4px';document.querySelector('.c').appendChild(d);});
</script></body></html>
