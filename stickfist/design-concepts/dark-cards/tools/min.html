<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#222;display:flex;gap:40px;padding:40px;flex-wrap:wrap}
.card{width:750px;height:1050px;position:relative;overflow:hidden;background:#0a0a0b;color:#ebe6da;flex:none}
.card .bg,.card .fg{position:absolute;inset:0;width:100%;height:100%}
.card .fg{z-index:5}
.card .shade{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(10,10,11,.88) 0,rgba(10,10,11,.4) 16%,rgba(10,10,11,0) 30%),
  linear-gradient(0deg,#0a0a0b 0,rgba(10,10,11,.9) 7%,rgba(10,10,11,0) 18%)}
h1{position:absolute;left:0;right:0;top:206px;text-align:center;font-family:Archivo;font-weight:900;font-stretch:62%;font-variation-settings:'wdth' 62;white-space:nowrap;line-height:.8;letter-spacing:-.006em;text-transform:uppercase;z-index:4}
.no{position:absolute;left:0;right:0;bottom:34px;text-align:center;font-family:'IBM Plex Mono';font-size:15px;font-weight:500;letter-spacing:.42em;color:rgba(235,230,218,.72);z-index:6}
.no b{color:#ebe6da;font-weight:600}
.T3 .no b{color:#ff3b3b}

/* the back: matte black, the mark and this copy's code */
.back{display:flex;flex-direction:column;align-items:center;justify-content:center}
.back .mk{font-family:Archivo;font-weight:900;font-stretch:62%;font-variation-settings:'wdth' 62;font-size:118px;letter-spacing:.06em;line-height:.8;color:#ebe6da}
.back .mk{position:relative}
.back .mk::after{content:'';position:absolute;left:-14%;right:-14%;top:50%;height:7px;background:#c4232b;transform:rotate(-24deg)}
.back .qr{position:absolute;bottom:64px;width:120px;height:120px;background:#ebe6da;padding:8px}
.back .qr img{width:100%;height:100%;image-rendering:pixelated;display:block}
.back .cd{position:absolute;bottom:34px;font-family:'IBM Plex Mono';font-size:12px;letter-spacing:.3em;color:rgba(235,230,218,.55)}
</style></head><body>
<div class="card T0" id="M_T0"><img class="bg" src="out/M_T0.png"><div class="shade"></div><h1>Phantom</h1><img class="fg" src="out/M_T0_fg.png"><div class="no">Nº <b>1184</b> / 2500</div></div>
<div class="card T1" id="M_T1"><img class="bg" src="out/M_T1.png"><div class="shade"></div><h1>Phantom</h1><img class="fg" src="out/M_T1_fg.png"><div class="no">Nº <b>212</b> / 500</div></div>
<div class="card T2" id="M_T2"><img class="bg" src="out/M_T2.png"><div class="shade"></div><h1>Phantom</h1><img class="fg" src="out/M_T2_fg.png"><div class="no">Nº <b>41</b> / 100</div></div>
<div class="card T3" id="M_T3"><img class="bg" src="out/M_T3.png"><div class="shade"></div><h1>Phantom</h1><img class="fg" src="out/M_T3_fg.png"><div class="no"><b>1</b> / 1</div></div>
<div class="card back" id="M_back"><div class="mk">STIXX</div><div class="qr"><img src="out/qr.png"></div><div class="cd">IS19-001184-H45M</div></div>
<script>
for (const h of document.querySelectorAll('h1')) {
  let fs = 260; h.style.fontSize = fs + 'px';
  const r = document.createRange(); r.selectNodeContents(h);
  while (r.getBoundingClientRect().width > 640 && fs > 60) { fs -= 2; h.style.fontSize = fs + 'px'; }
}
</script>
</body></html>
