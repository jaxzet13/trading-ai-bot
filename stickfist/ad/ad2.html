     5.0  one pack, one breath of silence, one tear

    19.1  a card from that pack runs: a simulated market, the sell, the profit (after the 10% fee, like the app)
    27.3  "first pack free", and the last second dives into the letters again so the film loops into its own first frame

   a teal-and-amber grade, vignette and grain, and handed to ffmpeg by render.js. audio2.py scores it from the timeline in window.TL.
   The market scene is an illustration of how a run can go in the app's simulated market (the card's real ceiling is 12x; this one tops out at 10.6x),

/* ---------------------------------------------------------------- canvases */
const S = mk(W, H), sx = S.getContext("2d");
const O = document.getElementById("o"), ox = O.getContext("2d", { willReadFrequently: true });
const B1 = mk(480, 270), b1 = B1.getContext("2d"), B2 = mk(120, 68), b2 = B2.getContext("2d"), K1 = mk(24, H), k1 = K1.getContext("2d"), K2 = mk(96, H), k2 = K2.getContext("2d");

const loadImg = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });

/* ---------------------------------------------------------------- drawing kit */
function txt(s, x, y, size, col, o) {

  for (let i = 0; i < n; i++) { const k = i / Math.max(1, n - 1), th = ang + (k - .5) * (spread || 1.7) + Math.sin(t * .35 + i * 1.7) * .035, w = .028 + .05 * hash(i, 1, 9), g = sx.createLinearGradient(0, 0, Math.cos(th) * len, Math.sin(th) * len);

function dust(t, n, seed, a, col) {                                   // a drift of floating motes at many depths, the near ones large and soft like bokeh
  sx.save(); sx.globalCompositeOperation = "lighter";

    const d = hash(i, 1, seed), sp = 6 + d * 30, x = ((hash(i, 2, seed) * W * 1.3 + t * sp * (i % 3 ? 1 : -.6)) % (W * 1.3) + W * 1.3) % (W * 1.3) - W * .15, y = FY0 + (((hash(i, 3, seed) * FH - t * (4 + d * 16)) % FH) + FH) % FH;
    const r = d > .88 ? 16 + d * 26 : .8 + d * 3.2, tw = .45 + .55 * Math.sin(t * (.8 + d * 2) + i), al = a * tw * (d > .88 ? .13 : .25 + .5 * d);

const GL = ".:+*#@$%&";

  for (let i = 0; i < n; i++) {

  sx.save(); rr(sx, -w / 2, -h / 2, w, h, w * .045); sx.clip(); sx.imageSmoothingQuality = "high"; sx.drawImage(img, -w / 2, -h / 2, w, h);

/* ---------------------------------------------------------------- act 2: the pack and the tear */
