<!doctype html>
<meta charset="utf-8">
<title>STIXX: ascii player</title>
<style>
@font-face { font-family: "JetBrains Mono"; src: local("JetBrains Mono"), local("DejaVu Sans Mono"); }
html, body { margin: 0; background: #000; overflow: hidden; }
#stage { position: relative; width: 540px; height: 960px; overflow: hidden; background: #07070c; font-family: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace; }
/* top: the picture, played as letters. bottom: the code that plays it */
#top { position: absolute; left: 0; top: 0; width: 540px; height: 548px; background: #07070c; }
#cv { position: absolute; left: 0; top: 0; width: 540px; height: 548px; }
#code { position: absolute; left: 0; right: 0; top: 548px; bottom: 0; background: #0f1220; border-top: 1px solid #23273a; }
.bar { height: 26px; background: #171a29; display: flex; align-items: center; gap: 7px; padding: 0 11px; color: #8d93ab; font-size: 10.5px; border-bottom: 1px solid #23273a; }
.bar .d { width: 10px; height: 10px; border-radius: 50%; } .bar .t { margin-left: 16px; }
#vw { position: absolute; left: 0; right: 0; top: 26px; bottom: 0; overflow: hidden; }
#lines { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.cl { display: flex; height: 12.4px; line-height: 12.4px; font-size: 8.7px; color: #cdd2e6; }
.cl .cn { width: 26px; flex: none; text-align: right; padding-right: 9px; color: #4b5170; } .cl .ct { white-space: pre; }
.cl.hl { background: rgba(120,150,255,.14); box-shadow: inset 2px 0 0 #7aa2ff; } .cl.hl .cn { color: #b4bfff; }
.tk { color: #bb9af7; } .ts { color: #e0af68; } .tc { color: #565f89; font-style: italic; } .tf { color: #7aa2f7; } .tn { color: #ff9e64; } .tb { color: #7dcfff; }
/* the end: the logo and a search bar */
#end { position: absolute; inset: 0; background: #0b0c14; display: grid; place-content: center; justify-items: center; gap: 22px; opacity: 0; }
#end .lg { width: 92px; height: 92px; } #end .nm { font-weight: 800; font-size: 46px; letter-spacing: .2em; color: #f5f3ee; padding-left: .2em; margin-top: -6px; }
#end .sb { display: flex; align-items: center; gap: 10px; width: 330px; height: 46px; background: #fff; border-radius: 12px; box-shadow: 0 0 0 3px #0b0c14, -3px 0 0 3px #25f4ee, 3px 0 0 3px #fe2c55; padding: 0 12px; box-sizing: border-box; color: #111; font-size: 16px; font-weight: 600; }
#end .sb svg { width: 20px; height: 20px; flex: none; } #end .sb span { flex: 1; } #end .sb .k { width: 26px; height: 26px; background: #000; border-radius: 6px; flex: none; display: grid; place-content: center; }
#end .fine { position: absolute; bottom: 34px; left: 30px; right: 30px; text-align: center; font-size: 10.5px; color: #7d8190; line-height: 1.5; }
#fx { position: absolute; inset: 0; pointer-events: none; } #grain { position: absolute; inset: 0; mix-blend-mode: overlay; opacity: .06; }
</style>
<div id="stage">
  <div id="top"><canvas id="cv" width="1080" height="1096"></canvas></div>
  <div id="code"><div class="bar"><span class="d" style="background:#ff5f57"></span><span class="d" style="background:#febc2e"></span><span class="d" style="background:#28c840"></span><span class="t">ascii_player.py  —  Renderer.convert() + draw()</span></div><div id="vw"><div id="lines"></div></div></div>
  <div id="end"><svg class="lg" viewBox="0 0 28 28"><rect x=".5" y=".5" width="27" height="27" rx="7.5" fill="#000" stroke="rgba(255,255,255,.2)"/><circle cx="14" cy="5.9" r="1.55" fill="#fff"/><path d="M8.2 9.8 19.8 21.4M19.8 9.8 8.2 21.4" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg><div class="nm">STIXX</div>
    <div class="sb"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg><span id="sbt"></span><i class="k"><svg viewBox="0 0 28 28" width="18" height="18"><circle cx="14" cy="5.9" r="1.55" fill="#fff"/><path d="M8.2 9.8 19.8 21.4M19.8 9.8 8.2 21.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></i></div>
    <div class="fine">your first pack is free. play money only, nothing is charged or paid out. 18+</div></div>
  <div id="fx"><svg id="grain" width="540" height="960"><filter id="gf"><feTurbulence id="gt" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1"/><feColorMatrix type="saturate" values="0"/></filter><rect width="540" height="960" filter="url(#gf)"/></svg></div>
</div>
<script>
const FPS = 30, DUR = 22, END0 = 19.0;
const SCN = [["src/luna.jpg", 0, 6.5], ["src/ronin.jpg", 6.5, 12.9], ["src/apogee.jpg", 12.9, 19.0]];
const $ = id => document.getElementById(id), cl = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x, eo = x => 1 - Math.pow(1 - cl(x), 3), eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const hash = (a, b) => { let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

/* ---- the code (the real renderer, wrapped to fit) ---- */
const SRC = `class Renderer:
    RAMP = " .'\`^\\",:;Il!i><~+_-?][}{1)(|\\\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$"

    def convert(self, frame):
        cols, rows = self.cols, self.rows
        img = cv2.resize(frame, (cols, rows * 2), interpolation=cv2.INTER_AREA)
        if self.saturation != 1.0:
            hsv = cv2.cvtColor(img, cv2.COLOR_BGR2HSV).astype(np.float32)
            hsv[..., 1] = np.clip(hsv[..., 1] * self.saturation, 0, 255)
            img = cv2.cvtColor(hsv.astype(np.uint8), cv2.COLOR_HSV2BGR)
        rgb = img[..., ::-1].astype(np.float32)

        lum = (0.299 * rgb[..., 0] + 0.587 * rgb[..., 1] + 0.114 * rgb[..., 2]) / 255.0
        n = len(self.RAMP)
        idx = np.clip((lum ** self.gamma * (n - 1) + 0.5).astype(np.int32), 0, n - 1)
        idx[lum < 0.035] = 0
        glyph = self.RAMP[idx]

        if self.edges > 0:
            gray = lum.astype(np.float32)
            gx = cv2.Sobel(gray, cv2.CV_32F, 1, 0, ksize=3)
            gy = cv2.Sobel(gray, cv2.CV_32F, 0, 1, ksize=3)
            mag = np.hypot(gx, gy) / 4.0
            ang = (np.degrees(np.arctan2(gy, gx)) + 90.0) % 180.0
            sel = np.array(["-", "\\\\", "|", "/"])[(((ang + 22.5) % 180.0) // 45).astype(np.int32)]
            mask = (mag > (0.8 - 0.6 * self.edges)) & (lum > 0.12)
            glyph = np.where(mask, sel, glyph)

        v = np.maximum(rgb.max(-1, keepdims=True), 1.0)
        fg_rgb = rgb * 0.4 + rgb * (255.0 / v) * 0.6
        fg = self._pack(fg_rgb)
        bg = self._pack(rgb * self.bg_tint)
        blank = glyph == " "
        fg = np.where(blank, 0, fg)
        return glyph, fg, bg

    def draw(self, grid) -> int:
        glyph, fg, bg = grid
        out: list[str] = []
        pg = self.prev
        for y in range(self.rows):
            if pg is None:
                idxs = np.arange(self.cols)
            else:
                ch = (glyph[y] != pg[0][y]) | (fg[y] != pg[1][y]) | (bg[y] != pg[2][y])
                idxs = np.flatnonzero(ch)
                if idxs.size == 0:
                    continue
            seg_start = prev_i = int(idxs[0])
            segs = []
            for i in idxs[1:]:
                i = int(i)
                if i - prev_i > 6:
                    segs.append((seg_start, prev_i)); seg_start = i
                prev_i = i
            segs.append((seg_start, prev_i))
            for a, b in segs:
                out.append(f"\\x1b[{self.y0 + y + 1};{self.x0 + a + 1}H")
                for x in range(a, b + 1):
                    f, k = int(fg[y, x]), int(bg[y, x])
                    if k != self.cur_bg:
                        out.append(self._sgr("b", k)); self.cur_bg = k
                    if f != self.cur_fg:
                        out.append(self._sgr("f", f)); self.cur_fg = f
                    out.append(glyph[y, x])
        self.prev = (glyph.copy(), fg.copy(), bg.copy())
        text = "".join(out)
        if text:
            self.term.write(text)
        return len(text)`;
const KW = new Set("import from def for in if return continue while not and or as with class else elif try except".split(" ")), BI = new Set("int min max len range sorted sum abs float tuple set print str list np cv2 self".split(" "));
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
function hl(line) {
  let out = "", i = 0; const n = line.length;
  while (i < n) {
    const ch = line[i];
    if (ch === "#") { out += `<span class="tc">${esc(line.slice(i))}</span>`; break; }
    if (ch === "'" || ch === '"') { let j = i + 1; while (j < n && line[j] !== ch) { if (line[j] === "\\") j++; j++; } out += `<span class="ts">${esc(line.slice(i, j + 1))}</span>`; i = j + 1; continue; }
    if (/[0-9]/.test(ch)) { let j = i; while (j < n && /[0-9.]/.test(line[j])) j++; out += `<span class="tn">${line.slice(i, j)}</span>`; i = j; continue; }
    if (/[A-Za-z_]/.test(ch)) { let j = i; while (j < n && /[A-Za-z_0-9]/.test(line[j])) j++; const w = line.slice(i, j); let c = ""; if (KW.has(w)) c = "tk"; else if (BI.has(w)) c = "tb"; else if (line[j] === "(") c = "tf"; out += c ? `<span class="${c}">${w}</span>` : w; i = j; continue; }
    out += esc(ch); i++;
  }
  return out;
}
const LN = SRC.split("\n"), FIRST = 259; $("lines").innerHTML = LN.map((t, k) => `<div class="cl"><span class="cn">${FIRST + k}</span><span class="ct">${hl(t)}</span></div>`).join("");
const ROWS = [...$("lines").children];

/* ---- the picture, played as letters: a frame is shrunk to one pixel per cell, and each cell becomes the glyph whose ink matches it ---- */
const RAMP = " .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
const CW = 4.6, CH = 8.0, W = 540, H = 548, COLS = Math.floor(W / CW), RWS = Math.floor(H / CH), cv = $("cv"), g = cv.getContext("2d"), off = document.createElement("canvas"); off.width = COLS; off.height = RWS; const og = off.getContext("2d", { willReadFrequently: true });
g.scale(2, 2); g.textAlign = "center"; g.textBaseline = "middle"; g.font = `bold ${CH * 1.02}px "DejaVu Sans Mono", monospace`;
const IM = SCN.map(s => { const i = new Image(); i.src = s[0]; return i; });
function frame(t) {
  og.fillStyle = "#000"; og.fillRect(0, 0, COLS, RWS);
  let thread = null;
  SCN.forEach((s, k) => {
    const [, a, b] = s, u = (t - a) / (b - a); if (u < 0 || u >= 1 || !IM[k].complete) return;
    // a card is let down on a thread and grows into the frame; it fades in at the start and out at the end
    const z = .3 + .88 * eo(u / .92), ih = RWS * z * 1.12, iw = ih * (IM[k].width / IM[k].height), bottom = RWS * (.95 - .05 * eio(u)), cx = COLS / 2 + Math.sin(u * 3.2 + k) * COLS * .015 * (1 - u), top = bottom - ih;
    og.globalAlpha = Math.min(sm01(u / .06), 1 - sm01((u - .94) / .06)); og.drawImage(IM[k], cx - iw / 2, top, iw, ih); og.globalAlpha = 1; if (top > 1) thread = { x: Math.round(cx), to: top, a: og };
  });
  const d = og.getImageData(0, 0, COLS, RWS).data;
  g.fillStyle = "#07070c"; g.fillRect(0, 0, W, H);
  for (let y = 0; y < RWS; y++) for (let x = 0; x < COLS; x++) {
    const p = (y * COLS + x) * 4, r = d[p], gg = d[p + 1], bb = d[p + 2], l = (.299 * r + .587 * gg + .114 * bb) / 255; if (l < .05) continue;
    const m = Math.max(r, gg, bb) || 1, kk = Math.min(1, .72 + l * .6) * 255 / m; g.fillStyle = `rgb(${Math.min(255, r * kk) | 0},${Math.min(255, gg * kk) | 0},${Math.min(255, bb * kk) | 0})`;
    g.fillText(RAMP[Math.min(RAMP.length - 1, (Math.pow(l, .75) * (RAMP.length - 1) + .5) | 0)], (x + .5) * CW, (y + .55) * CH);
  }
  if (thread) { const tt = Math.floor(t * 12); for (let y = 0; y < thread.to - 1; y++) { g.fillStyle = `rgba(110,150,210,${(.35 + .5 * hash(y, tt)).toFixed(2)})`; g.fillText(hash(y + 7, tt) > .5 ? "|" : ":", (thread.x + .5) * CW, (y + .55) * CH); } }
}
const sm01 = x => { x = cl(x); return x * x * (3 - 2 * x); };
function render(t) {
  t = cl(t, 0, DUR - 1 / FPS / 2);
  $("stage").style.opacity = sm01(t / .25);
  const showEnd = t >= END0; $("end").style.opacity = showEnd ? 1 : 0; $("top").style.visibility = $("code").style.visibility = showEnd ? "hidden" : "visible";
  if (showEnd) { const e = t - END0, full = "stixx"; $("sbt").textContent = full.slice(0, Math.floor(cl(e / .9) * full.length)); $("end").style.transform = `scale(${(1 + .02 * eo(e / 1.5)).toFixed(4)})`; }
  else frame(t);
  // the code scrolls steadily, a few lines a second, and the highlighted line walks down it
  const s = 2.6 * t, line = Math.floor(s) + 9; $("lines").style.transform = `translateY(${(-(s * 12.4) + 6).toFixed(1)}px)`; ROWS.forEach((r, k) => r.classList.toggle("hl", k === line));
  $("gt").setAttribute("seed", String(Math.floor(t * 30) % 97));
}
window.TL = { dur: DUR, fps: FPS, EV: [] };
window.renderAt = t => { render(t); return true; };
window.READY = (async () => { await document.fonts.ready; await Promise.all(IM.map(i => i.decode ? i.decode().catch(() => 0) : 0)); render(0); return true; })();
</script>
