<!doctype html>
<meta charset="utf-8">
<title>STIXX teaser</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="o" width="1080" height="1920"></canvas>
<script>
/* ============================================================================================================================================
   STIXX teaser, take two: a 33 second vertical film. Six steps (buy a pack, get cards, watch the value go up, sell at the peak, watch your profit
   fly, collect your favourites) and then a cliffhanger. The cards are the app's own pictures, drawn the way the app draws them; ASCII is the
   language of everything around them: the captions, the charts, the way a card decodes out of text, the static. Every frame is worked out from the
   clock, pushed through a pixel pass (tear, RGB split, grain, scanlines, bloom) and handed to ffmpeg by render.js.
   ?handle=@name puts an account name on the end card. Without it the end card says "follow this account".
   ========================================================================================================================================== */
const W = 1080, H = 1920, FPS = 30;
const HANDLE = (new URLSearchParams(location.search).get("handle") || "").trim();
const FONT = "'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace";
const RAMP = " .'`,:;-~=+*xX#%@";
const ADV = .6, LHR = 1.12;                       // a character is .6 em wide and 1.12 em tall
const FS = 20, CW = FS * ADV, LH = Math.round(FS * LHR), C = Math.floor(W / CW), R = Math.floor(H / LH);

/* ---------------------------------------------------------------- helpers */
const hash = (a, b, c) => { let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul((c || 0) | 0, 2147483647); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

const mixv = (a, b, k) => a + (b - a) * k;

const ease2 = x => { x = cl(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };

const kf = (tab, t) => { if (t <= tab[0][0]) return tab[0][1]; for (let i = 1; i < tab.length; i++) if (t < tab[i][0]) { const a = tab[i - 1], b = tab[i]; return mixv(a[1], b[1], (t - a[0]) / (b[0] - a[0])); } return tab[tab.length - 1][1]; };
const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const mkpal = stops => Array.from({ length: 32 }, (_, i) => { const k = i / 31 * (stops.length - 1), j = Math.min(stops.length - 2, Math.floor(k)), f = k - j, a = stops[j], b = stops[j + 1]; return [mixv(a[0], b[0], f), mixv(a[1], b[1], f), mixv(a[2], b[2], f)]; });
const INK = [236, 231, 220], DIM = [141, 137, 127], FAINT = [74, 74, 82], GRN = [159, 216, 166], RED = [232, 120, 109], GOLD = [255, 210, 122], AMB = [255, 181, 74], WHT = [255, 255, 255];
const pad = (n, k) => String(n).padStart(k || 2, "0");
const moneyC = c => "$" + (c / 100).toFixed(c < 100 ? 3 : 2);        // cents to dollars, with the extra digit a small number needs
const pctS = p => (p >= 0 ? "▲ +" : "▼ −") + Math.round(Math.abs(p)).toLocaleString("en-US") + "%";

/* ---------------------------------------------------------------- the timeline: the one place the film's timing lives. Durations in seconds; everything else is placed relative to them.
   Each caption is typed in a second or so and then stays up for at least a second and a half before it dissolves, so it can be read. render.js hands the result to audio.py */
const D = { cold: 4.2, buy: 3.4, cards: 5.3, zoom: 6.2, rise: 4.8, sell: 3.8, profit: 3.2, collect: 4.6, build: 3.4, rip: .7, reveal: 3.0, black: .9, end: 5.4 };

const DUR = _acc, STEPY = .095, STEP = { fy: STEPY, c: INK, hl: [0, 1, GOLD] };
const LINES = [];
const line = (act, u0, s, cps, o) => LINES.push(Object.assign({ s, t0: T[act][0] + u0, cps, t1: T[act][1] }, o));
line("cold", .6, "trading cards", 13, { fy: .39, c: INK, size: 76 });
line("cold", 1.5, "that move like memecoins.", 24, { fy: .455, c: WHT, size: 62, hl: [14, 24, WHT] });
line("buy", .2, "1  buy a pack", 18, Object.assign({ size: 60 }, STEP));
line("cards", .3, "2  get cards", 18, Object.assign({ size: 60 }, STEP));
line("zoom", .25, "every card is made of text.", 20, { fy: STEPY, c: INK, size: 54 });
line("zoom", 3.2, "one card. 71,680 characters.", 20, { fy: .80, c: GOLD, size: 46 });
line("rise", .15, "3  watch the value go up", 20, Object.assign({ size: 58 }, STEP));
line("rise", 1.2, "like stocks. like memecoins.", 22, { fy: .80, c: DIM, size: 44 });
line("sell", .1, "4  sell at the peak", 20, Object.assign({ size: 60 }, STEP));
line("sell", .8, "whenever you feel it's the highest.", 26, { fy: .80, c: DIM, size: 40 });
line("profit", .1, "5  watch your profit fly", 20, Object.assign({ size: 58 }, STEP));
line("collect", .1, "6  collect your favorites", 22, Object.assign({ size: 56 }, STEP));
line("collect", 1.6, "hoping they skyrocket.", 20, { fy: .80, c: GRN, size: 48 });
line("build", .15, "that's how it works.", 20, { fy: .145, c: DIM, size: 52 });
line("build", .9, "now see what's inside.", 22, { fy: .205, c: WHT, size: 58 });
line("reveal", .15, "S E C R E T", 12, { fy: .105, c: [255, 232, 180], size: 34, rot: T.reveal[0] + 2.3 });
line("reveal", .3, "U M B R A", 9, { fy: .165, c: AMB, size: 76, rot: T.reveal[0] + 2.1 });
line("end", 1.2, "beta drops soon.", 11, { fy: .44, c: WHT, size: 84, t1: 99 });
line("end", 2.5, "follow this account.", 14, { fy: .54, c: GRN, size: 58, t1: 99 });
if (HANDLE) line("end", 3.6, HANDLE, 14, { fy: .60, c: WHT, size: 62, t1: 99 });
LINES.forEach(l => { const hold = Math.min(l.t1, DUR) - .3 - (l.t0 + l.s.length / l.cps); if (l.t1 < 99 && !l.rot && hold < 1.15) console.error("caption stays up too briefly:", l.s, hold.toFixed(2)); });
const KEYS = { rip: T.rip[0], reveal: T.reveal[0], cutBlack: T.reveal[1], logo: T.end[0] + .3, end: DUR };
// glitch hits: a cut, a slam, a tear. Each is a flash of tear + RGB split + snow that dies away in about a fifth of a second.
const HITS = [];
for (const k of ["buy", "cards", "zoom", "rise", "sell", "profit", "collect", "build", "rip"]) HITS.push({ t: T[k][0], a: 1 });
HITS.push({ t: .05, a: 1.1 }, { t: 1.5, a: .5 }, { t: T.cold[1] - .15, a: .6 }, { t: T.buy[0] + 2.1, a: .6 });
for (let i = 0; i < 5; i++) HITS.push({ t: T.cards[0] + .8 + i * .9, a: .6 });
HITS.push({ t: T.zoom[0] + 1.0, a: .35 }, { t: T.zoom[0] + 4.3, a: .5 }, { t: T.zoom[0] + 5.4, a: .4 });
HITS.push({ t: T.rise[0] + 2.7, a: .35 }, { t: T.rise[0] + 3.6, a: .4 }, { t: T.sell[0] + 1.9, a: .7 }, { t: T.profit[0] + .05, a: .5 });
HITS.push({ t: T.collect[0] + 2.4, a: .5 }, { t: T.collect[0] + 2.75, a: .4 });
HITS.push({ t: T.build[0] + 1.0, a: .5 }, { t: T.build[0] + 1.9, a: .7 }, { t: T.build[0] + 2.5, a: .8 }, { t: T.rip[0] - .2, a: 1 });
HITS.push({ t: T.reveal[0] + .6, a: .5 }, { t: T.reveal[0] + 1.2, a: .6 }, { t: T.reveal[0] + 1.7, a: .8 }, { t: T.reveal[0] + 2.2, a: 1.1 });
HITS.push({ t: T.end[0] + .35, a: 1 }, { t: T.end[0] + 1.2, a: .5 }, { t: T.end[0] + 2.5, a: .4 }, { t: DUR - .2, a: 1.4 });
// the heartbeat: slow in the cold open, then it comes back at the end and speeds up until the pack rips. lub, then a softer dub
const HEART = []; for (const t of [.6, 1.7, 2.8, 3.9]) HEART.push({ t, a: 1 }, { t: t + .2, a: .55 });
const HB0 = T.build[0] + .1, beatIv = t => t < T.cold[1] ? 1.1 : mixv(.62, .3, Math.pow(cl((t - HB0) / (T.reveal[1] - HB0)), 1.2));
{ let t = HB0; while (t < T.reveal[1]) { const iv = beatIv(t); HEART.push({ t, a: 1 }, { t: t + Math.min(.18, iv * .3), a: .55 }); t += iv; } }
const TL = { dur: DUR, fps: FPS, T, LINES: LINES.map(l => ({ s: l.s, t0: l.t0, cps: l.cps, t1: Math.min(l.t1, DUR) })), HITS, HEART, KEYS };

/* ---------------------------------------------------------------- canvases */
const O = document.getElementById("o"), ox = O.getContext("2d", { willReadFrequently: true });
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const S = mk(W, H), sx = S.getContext("2d"), B1 = mk(270, 480), b1 = B1.getContext("2d"), B2 = mk(90, 160), b2 = B2.getContext("2d");
const IMG = {};
const loadImg = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
const gridCache = {};
const TONE = { umbra: [1.5, 1.45] };                  // [gain, power]: the eclipse is bright everywhere, so it needs a harder curve to keep its rays
function sampleImage(key, n) {                       // a picture read into characters: n columns, as many rows as keep its shape
  const id = key + n, [gain, pw] = TONE[key] || [2.6, .7]; if (gridCache[id]) return gridCache[id];
  const img = IMG[key], rows = Math.max(2, Math.round(n * (img.height / img.width) / (LHR / ADV))), c = mk(n, rows), x = c.getContext("2d"); x.drawImage(img, 0, 0, n, rows);
  const d = x.getImageData(0, 0, n, rows).data, l = new Float32Array(n * rows);
  for (let i = 0; i < n * rows; i++) l[i] = Math.pow(cl(((d[i * 4] * .299 + d[i * 4 + 1] * .587 + d[i * 4 + 2] * .114) / 255 - .03) * gain), pw);
  return gridCache[id] = { cols: n, rows, l };

/* ---------------------------------------------------------------- drawing: everything goes through these, which only queue; render() paints in order */
let ops = [], flashA = 0, clock = 0;
const put = (x, y, ch, c, a) => ops.push([0, x, y, ch, c, a == null ? 1 : a]);                                   // one character on the 20px grid
const pch = (px, py, size, ch, c, a) => ops.push([1, px, py, size, ch, c, a == null ? 1 : a]);                    // one character anywhere, any size
const rect = (px, py, w, h, c, a) => ops.push([2, px, py, w, h, c, a == null ? 1 : a]);
const later = fn => ops.push([3, fn]);                                                                            // anything else, painted in its turn
const flash = a => { flashA = Math.max(flashA, a); };
function art(lines, px, py, size, c, a, rev) {       // lines of art in pixel space. c is a colour or a function (i, j, ch) -> colour. rev (0..1) builds it from static
  const adv = size * ADV, lh = size * LHR, al = a == null ? 1 : a, rv = rev == null ? 1 : rev;
  for (let j = 0; j < lines.length; j++) { const s = lines[j]; for (let i = 0; i < s.length; i++) { const ch = s[i]; if (ch === " ") continue; const k = rv * 1.5 - hash(i, j, 3) * .6; if (k <= 0) continue; const col = typeof c === "function" ? c(i, j, ch) : c; if (!col) continue; pch(px + i * adv, py + j * lh, size, k < .35 ? ".:*#"[(i + j + Math.floor(clock * 18)) % 4] : ch, col, k < .35 ? al * .5 : al); } }
}
const artW = (lines, size) => Math.max(...lines.map(s => s.length)) * size * ADV;
const artC = (lines, cx, py, size, c, a, rev) => art(lines, Math.round(cx - artW(lines, size) / 2), py, size, c, a, rev);
function box(px, py, w, h, size, c, a, dbl) {          // a frame of box-drawing characters, w and h in characters
  const adv = size * ADV, lh = size * LHR, [hz, vt, tl, tr, bl, br] = dbl ? ["═", "║", "╔", "╗", "╚", "╝"] : ["─", "│", "┌", "┐", "└", "┘"];
  for (let i = 1; i < w - 1; i++) { pch(px + i * adv, py, size, hz, c, a); pch(px + i * adv, py + (h - 1) * lh, size, hz, c, a); }
  for (let j = 1; j < h - 1; j++) { pch(px, py + j * lh, size, vt, c, a); pch(px + (w - 1) * adv, py + j * lh, size, vt, c, a); }
  pch(px, py, size, tl, c, a); pch(px + (w - 1) * adv, py, size, tr, c, a); pch(px, py + (h - 1) * lh, size, bl, c, a); pch(px + (w - 1) * adv, py + (h - 1) * lh, size, br, c, a);
}
function field(fn, pal, alpha) {                      // a character shader over the whole screen: l = fn(x, y), x and y in screen widths from the centre
  const al = alpha == null ? 1 : alpha;
  for (let y = 0; y < R; y++) for (let x = 0; x < C; x++) {
    const l = fn(((x + .5) * CW - W / 2) / W, ((y + .5) * LH - H / 2) / W, x, y); if (l < .035) continue;
    const k = cl(l), ch = RAMP[Math.min(RAMP.length - 1, Math.floor(k * RAMP.length))];
    put(x, y, ch, pal[Math.min(31, Math.round(k * 31))], al);
  }
}
const glowAt = (x, y, r, c, a) => later(() => { const g = sx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(c, a)); g.addColorStop(.45, rgba(c, a * .35)); g.addColorStop(1, rgba(c, 0)); sx.globalAlpha = 1; sx.fillStyle = g; sx.fillRect(x - r, y - r, r * 2, r * 2); });
const typed = (str, t, t0, cps) => str.slice(0, Math.max(0, Math.floor((t - t0) * cps)));
const spaced = s => s.split("").join(" ");

/* ---------------------------------------------------------------- the big captions, one character at a time */
function drawLines(t) {
  for (const L of LINES) {
    if (t < L.t0 || t > L.t1) continue;
    const full = L.s, n = Math.min(full.length, Math.max(0, Math.floor((t - L.t0) * L.cps)) + 1), adv = L.size * ADV, x0 = (W - full.length * adv) / 2 + adv / 2, y = H * L.fy;
    const out = cl((t - (L.t1 - .3)) / .3), typing = n < full.length, frame = Math.floor(t * 30);
    sx.font = `700 ${L.size}px ${FONT}`; sx.textAlign = "center"; sx.textBaseline = "middle";
    for (let i = 0; i < n; i++) {
      let ch = full[i]; if (ch === " ") continue;
      const age = t - (L.t0 + i / L.cps); let c = L.c, jx = 0;
      if (L.hl && i >= L.hl[0] && i < L.hl[1]) { c = L.hl[2]; if (L.hl[2] === WHT && hash(i, frame, 8) < .2 * (1 - out)) jx = (hash(i, frame, 9) - .5) * 14; }
      if (age < .09) { ch = "▒░#%@"[hash(i, frame, 7) * 5 | 0]; c = WHT; }                        // each letter lands as static and settles
      if (L.rot && t > L.rot && hash(i, Math.floor(t * 12), 11) < .35) { ch = "▒░█"[hash(i, frame, 12) * 3 | 0]; c = WHT; }
      if (out > 0 && hash(i, frame, 13) < out * 1.1) ch = "▒░#%@&"[hash(i, frame, 14) * 6 | 0];     // it dissolves into static on its way out
      sx.globalAlpha = 1 - out * .85; sx.shadowColor = rgb(c); sx.shadowBlur = 9; sx.fillStyle = rgb(c);
      sx.fillText(ch, x0 + i * adv + jx, y);
    }
    if (typing || (Math.floor(t * 2.4) % 2 === 0 && t < L.t1 - .3)) { sx.shadowBlur = 16; sx.globalAlpha = 1 - out; sx.fillStyle = rgb(L.c); sx.fillText("▌", x0 + n * adv, y); }
    sx.globalAlpha = 1; sx.shadowBlur = 0;
  }
}
function bigText(str, cx, y, size, c, a, blur) {     // one line, centred, for the numbers and tags
  sx.font = `700 ${size}px ${FONT}`; sx.textAlign = "center"; sx.textBaseline = "middle"; sx.globalAlpha = a == null ? 1 : a; sx.shadowColor = rgb(c); sx.shadowBlur = blur == null ? 18 : blur; sx.fillStyle = rgb(c); sx.fillText(str, cx, y); sx.globalAlpha = 1; sx.shadowBlur = 0;
}
const textOp = (str, cx, y, size, c, a, blur) => later(() => bigText(str, cx, y, size, c, a, blur));   // the same, but in its place in the stack, so a card can sit on top of it

/* ---------------------------------------------------------------- the cards: the app's own pictures, drawn the way the app draws them */
const CD = {   // name, rarity, characters on the card, colour, the line under the name: all from the app's data
  "stitch-kin": { name: "STITCH", rar: "common", chars: 2772, tint: [236, 231, 220], cap: "frog hat. zero regrets." },
  orbit: { name: "ORBIT", rar: "uncommon", chars: 7260, tint: [169, 201, 255], cap: "already read the ending." },
  "orbit-kin": { name: "ORBIT", rar: "uncommon", chars: 7260, tint: [169, 201, 255], cap: "already read the ending." },
  "null-kin": { name: "NULL", rar: "rare", chars: 29260, tint: [169, 201, 255], cap: "not on any record." },
  ronin: { name: "RONIN", rar: "epic", chars: 71680, tint: [255, 138, 201], cap: "" },
  grimm: { name: "GRIMM", rar: "legendary", chars: 219520, tint: [168, 255, 176], cap: "" },
  umbra: { name: "UMBRA", rar: "secret", chars: 1578000, tint: [255, 181, 74], cap: "the sun blinked first." },
  "umbra-kin": { name: "UMBRA", rar: "secret", chars: 1578000, tint: [169, 201, 255], cap: "" },
  shogun: { name: "SHOGUN", rar: "rare", chars: 31970, tint: [255, 210, 122], cap: "rents you the air." },
  "grimm-glass": { name: "GRIMM", rar: "legendary", chars: 219520, tint: [255, 138, 201], cap: "" },
  "phantom-kin": { name: "PHANTOM", rar: "uncommon", chars: 15750, tint: [169, 201, 255], cap: "gone before the cape lands." },
  "reaper-ice": { name: "REAPER", rar: "mythic", chars: 701000, tint: [169, 201, 255], cap: "" },

const CARD_KEYS = Object.keys(CD);

// o: rot, s (scale), a (alpha), glow, decode (0 = still text, 1 = the picture), sheen (0..1 sweeps a glint across), label (false for thumbnails), chip {s, c}, heart, ring
function drawCardNow(key, cx, cy, w, o) {
  const d = CD[key] || {}, img = IMG[key]; if (!img) return;
  const h = w * 1092 / 900, r = w * .045, tint = d.tint || INK, al = o.a == null ? 1 : o.a, s = o.s == null ? 1 : o.s; if (al <= .003) return;

    const nm = d.name || ""; for (let i = 0; i < nm.length; i++) sx.fillText(nm[i], lx + i * fs * .86, ly);
    sx.strokeStyle = rgba(tint, .35); sx.lineWidth = 1.5; const lx2 = lx + nm.length * fs * .86 + fs * .5; sx.beginPath(); sx.moveTo(lx2, ly - fs * .3); sx.lineTo(w / 2 - w * .3, ly - fs * .3); sx.stroke();
